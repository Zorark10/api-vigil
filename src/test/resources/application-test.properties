# Test profile: replaces the local Postgres/Redis/Kafka dependencies with
# in-memory / lazy equivalents so `mvnw test` works without live infrastructure.
# NOTE: regular H2 mode (not MODE=PostgreSQL) because the H2 PostgreSQL
# compatibility mode rejects the TINYINT column Hibernate generates for
# ordinal-mapped enums (MonitorResult.status has no @Enumerated).
spring.datasource.url=jdbc:h2:mem:apimonitor;DB_CLOSE_DELAY=-1;NON_KEYWORDS=INTERVAL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT settings for tests (never real secrets)
app.jwt.secret=test-jwt-secret-value-with-at-least-32-characters
app.jwt.expiration=PT1H

app.admin.username=admin
app.admin.password=test-admin-password
