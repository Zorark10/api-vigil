# Test profile: replaces the local Postgres/Redis/Kafka dependencies with
# in-memory / lazy equivalents so `mvnw test` works without live infrastructure.
spring.datasource.url=jdbc:h2:mem:apimonitor;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=INTERVAL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.mail.username=test@example.com
spring.mail.password=test-password
