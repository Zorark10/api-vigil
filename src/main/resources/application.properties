# Local is the default when no profile is explicitly selected. Render sets
# SPRING_PROFILES_ACTIVE=production; tests explicitly select the test profile.
spring.profiles.default=local

spring.datasource.url=jdbc:postgresql://localhost:5432/api_monitor
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson 3 enables fail-on-null-for-primitives by default; JSON bodies for
# create/patch entities legitimately omit boolean fields (e.g. "enabled"),
# which must fall back to the primitive default instead of failing.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Ownership migration for existing PostgreSQL databases. baseline-on-migrate
# baselines legacy (Hibernate-created) schemas at version 0 so V1__user_ownership.sql
# still runs against them; on an empty database it is a no-op and Hibernate
# creates the full schema.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Render supplies PORT; local runs continue to default to 8080.
server.port=${PORT:8080}

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=monitor-check-group

# Email delivery through the EmailJS REST API. Only the EmailJS service and
# template plus the public/private key pair identify the sender; credentials
# live in environment variables and are never exposed to the frontend.
# Recipients are managed in the dashboard and passed to the EmailJS template
# dynamically, so no SMTP or Gmail credentials are needed anywhere.
app.emailjs.service-id=${EMAILJS_SERVICE_ID:}
app.emailjs.template-id=${EMAILJS_TEMPLATE_ID:}
app.emailjs.public-key=${EMAILJS_PUBLIC_KEY:}
app.emailjs.private-key=${EMAILJS_PRIVATE_KEY:}
# Pacing honouring EmailJS's one-request-per-second limit (ms between sends).
app.emailjs.min-interval-ms=1100

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
